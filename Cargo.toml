[package]
name = "floway-cli"
version = "0.1.0"
edition = "2021"
description = "Set up agentic harnesses for the Floway API router"
license = "MIT"

[[bin]]
name = "floway"
path = "src/main.rs"

[profile.release]
strip = true
lto = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.9"
toml_edit = "0.23"
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
sha2 = "0.10"
