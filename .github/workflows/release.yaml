name: Release

# Build static release binaries for every platform and publish them to the
# GitHub Release for the pushed tag (`vX.Y.Z`). Binaries land as
# floway-<target><exe-suffix> plus a .sha256 checksum sidecar per artifact,
# and install.sh resolves the right one at install time.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN_NAME: floway

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # All Rust tier-2-and-up targets the CLI plausibly runs on. musl
          # builds are fully static so install.sh works on any glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            install-musl-tools: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            install-musl-tools: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross toolchain
        if: matrix.install-musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-tools-multi
          if [ '${{ matrix.target }}' = 'aarch64-unknown-linux-musl' ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_AARCH64_UNKNOWN_LINUX_MUSL: aarch64-linux-gnu-gcc
          AR_AARCH64_UNKNOWN_LINUX_MUSL: aarch64-linux-gnu-ar

      - name: Stage artifact
        shell: bash
        run: |
          EXT=''
          case '${{ matrix.target }}' in *windows*) EXT='.exe' ;; esac
          STAGE="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}$EXT" "$STAGE/${{ env.BIN_NAME }}$EXT"
          cp README.md LICENSE "$STAGE"/ 2>/dev/null || cp README.md "$STAGE"/
          if [ "$(uname -s)" = 'Darwin' ]; then
            sha256sum="" ; shasum -a 256 "$STAGE/${{ env.BIN_NAME }}$EXT" > "$STAGE/${{ env.BIN_NAME }}$EXT.sha256"
          else
            sha256sum "$STAGE/${{ env.BIN_NAME }}$EXT" > "$STAGE/${{ env.BIN_NAME }}$EXT.sha256"
          fi
          if [ "$(uname -s)" = 'Darwin' ]; then
            tar -czf "$STAGE.tar.gz" "$STAGE"
          else
            tar -czf "$STAGE.tar.gz" "$STAGE"
          fi
          echo "ARTIFACT=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
